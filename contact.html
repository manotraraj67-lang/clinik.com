<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback - HealthCare Clinic</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<header>

    <div class="logo">

        🩺 HealthCare

        <small>
            DR. L.S.PAL Clinic
        </small>

    </div>


    <nav>

        <a href="../index.html">
            🏠 Home
        </a>

        <a href="../doctor/doctor.html">
            👨‍⚕️ Doctor
        </a>

        <a href="../services/services.html">
            🏥 Services
        </a>

        <a href="contact.html">
            💬 Feedback
        </a>

    </nav>


    <a
        href="../appointment/appointment.html"
        class="appointment-btn">

        📅 Book Appointment

    </a>

</header>



<section>

    <h2>
        💬 Your Feedback Matters
    </h2>


    <p class="subtitle">
        Help us serve you better with your
        valuable feedback.
    </p>


    <div class="form-container">

        <form id="feedbackForm">


            <input
                type="text"
                id="feedbackName"
                placeholder="Your Name"
                required
            >


            <input
                type="email"
                id="feedbackEmail"
                placeholder="Your Email"
                required
            >


            <textarea
                id="feedbackMessage"
                placeholder="Share your experience with us..."
                required>
            </textarea>


            <button type="submit">

                ➤ Submit Feedback

            </button>


            <p
                id="feedbackResult"
                class="result">
            </p>


        </form>

    </div>

</section>



<footer>

    <strong>
        🩺 HealthCare Clinic
    </strong>

    <span>
        © 2026 Dr. L.S.PAL Clinic
    </span>

</footer>



<script src="../js/script.js"></script>

</body>

</html>
