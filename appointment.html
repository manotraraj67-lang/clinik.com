<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - HealthCare Clinic</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
        }

        header {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo small {
            display: block;
            font-size: 13px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 70px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 45px;
            color: #172554;
            margin-bottom: 12px;
        }

        .title p {
            color: #64748b;
            font-size: 18px;
        }

        .form-box {
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #dc2626;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #991b1b;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 25px;
        }

        .back a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 800px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }

            .form-box {
                padding: 25px;
            }

            .title h1 {
                font-size: 35px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">

        🩺 HealthCare

        <small>
            DR. L.S.PAL Clinic
        </small>

    </div>


    <nav>

        <a href="../index.html">🏠 Home</a>

        <a href="../doctor/doctor.html">👨‍⚕️ Doctor</a>

        <a href="../services/services.html">🏥 Services</a>

        <a href="../contact/contact.html">💬 Feedback</a>

    </nav>

</header>


<div class="container">


    <div class="title">

        <h1>
            Book Your Appointment
        </h1>

        <p>
            Fill the form and our clinic will
            receive your appointment request.
        </p>

    </div>


    <div class="form-box">


        <form id="appointmentForm">


            <div class="form-group">

                <label for="name">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter patient name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="service">
                    Select Service
                </label>

                <select
                    id="service"
                    name="service"
                    required
                >

                    <option value="">
                        Select a service
                    </option>

                    <option value="General Consultation">
                        General Consultation
                    </option>

                    <option value="Health Checkup">
                        Health Checkup
                    </option>

                    <option value="Medical Treatment">
                        Medical Treatment
                    </option>

                    <option value="Diagnostic Services">
                        Diagnostic Services
                    </option>

                    <option value="Doctor Consultation">
                        Doctor Consultation
                    </option>

                    <option value="Emergency Support">
                        Emergency Support
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="date">
                    Appointment Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <button type="submit">

                📅 Confirm Appointment

            </button>


        </form>


        <div id="status"></div>


        <div class="back">

            <a href="../index.html">
                ← Back to Home
            </a>

        </div>


    </div>

</div>


<script src="../js/script.js"></script>

</body>

</html>
